name: CloudCrackers CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Backend CI Job (FastAPI + Python 3.12)
  # ==========================================
  backend-ci:
    name: Backend CI (FastAPI + Pytest)
    runs-on: ubuntu-latest

    # Ephemeral MongoDB service container for test execution
    # Ensures zero dependency on production MongoDB Atlas credentials
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python syntax and imports
        working-directory: backend
        run: |
          python -m compileall app
          python -c "import app.main; print('FastAPI application imported successfully.')"

      - name: Run Pytest test suite
        working-directory: backend
        env:
          ENVIRONMENT: development
          MONGODB_URL: mongodb://localhost:27017
          DB_NAME: cloudcrackers_test
          JWT_SECRET_KEY: test_jwt_secret_key_for_ci_pipeline_only
        run: |
          pytest tests/ -v

  # ====================================================
  # 2. Frontend CI Job (Expo React Native + Web Build)
  # ====================================================
  frontend-ci:
    name: Frontend CI (Expo Web Build)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        run: npx expo export --platform web
