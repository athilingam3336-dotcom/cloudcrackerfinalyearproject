<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CloudCrackers - Premium Pyrotechnics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1D1E22; /* Mandatory Splash Background */
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom animation for the firework spark */
        @keyframes spark-float {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 10px #b7102a); }
            50% { transform: translateY(-10px) scale(1.05); filter: drop-shadow(0 0 25px #ffae1d); }
        }

        .spark-animation {
            animation: spark-float 3s ease-in-out infinite;
        }

        /* Smooth loading bar expansion */
        @keyframes loading-progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .loading-bar-inner {
            animation: loading-progress 4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        /* Entrance animations */
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-up-element {
            animation: fade-up 1s ease-out forwards;
        }

        /* Particles effect for the dark gray background */
        #particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>

<body class="bg-[#1D1E22] flex items-center justify-center min-h-screen">
<!-- Background Atmospheric Particles -->
<div id="particles-container"></div>
<!-- Main Content Container -->
<div class="relative z-10 flex flex-col items-center justify-center text-center px-margin-mobile md:px-margin-desktop">
<!-- Stylized Firework/Spark Logo -->
<div class="spark-animation mb-lg">
<div class="relative w-24 h-24 flex items-center justify-center">
<!-- Outer Glow -->
<div class="absolute inset-0 bg-primary-container opacity-20 blur-2xl rounded-full"></div>
<!-- Central Icon -->
<div class="relative flex items-center justify-center">
<span class="material-symbols-outlined text-[80px] text-primary" style="font-variation-settings: 'FILL' 1;">
                        flare
                    </span>
<!-- Secondary color accent -->
<span class="material-symbols-outlined absolute text-[32px] text-secondary-container" style="font-variation-settings: 'FILL' 1;">
                        auto_awesome
                    </span>
</div>
</div>
</div>
<!-- Elegant Brand Name -->
<h1 class="fade-up-element font-display-lg text-display-lg text-white mb-sm tracking-tight opacity-0" style="animation-delay: 0.2s;">
            CloudCrackers
        </h1>
<!-- Slogan -->
<p class="fade-up-element font-body-lg text-body-lg text-on-surface-variant opacity-0" style="animation-delay: 0.4s; color: rgba(255,255,255,0.6);">
            Premium pyrotechnics for moments that matter.
        </p>
<!-- Loading Section -->
<div class="fade-up-element fixed bottom-xl w-64 opacity-0 flex flex-col items-center gap-base" style="animation-delay: 0.8s;">
<!-- Loading Indicator Container -->
<div class="w-full h-1 bg-white/10 rounded-full overflow-hidden">
<div class="loading-bar-inner h-full bg-gradient-to-r from-primary to-secondary-container rounded-full shadow-[0_0_10px_rgba(183,16,42,0.5)]"></div>
</div>
<!-- Loading Status Text -->
<span class="font-label-lg text-label-lg uppercase text-white/40 tracking-[0.2em]">
                Initializing
            </span>
</div>
</div>
<!-- Micro-interaction Scripts -->
<script>
        // Simple background particle generator for atmospheric feel
        const container = document.getElementById('particles-container');
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            const size = Math.random() * 3 + 1;
            
            particle.style.position = 'absolute';
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.backgroundColor = Math.random() > 0.5 ? '#b7102a' : '#ffae1d';
            particle.style.borderRadius = '50%';
            particle.style.opacity = Math.random() * 0.4;
            
            // Random initial position
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            
            // Random movement animation
            const duration = 10 + Math.random() * 20;
            particle.animate([
                { transform: 'translate(0, 0)', opacity: particle.style.opacity },
                { transform: `translate(${(Math.random() - 0.5) * 200}px, ${(Math.random() - 0.5) * 200}px)`, opacity: 0 }
            ], {
                duration: duration * 1000,
                iterations: Infinity,
                direction: 'alternate',
                easing: 'ease-in-out'
            });
            
            container.appendChild(particle);
        }

        // Simulating the transition out of the splash screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                // In a real app, this would trigger the navigation to Home
                console.log('Splash sequence complete. Ready to enter CloudCrackers boutique.');
            }, 4500);
        });
    </script>
</body></html>
