    }

<body class="bg-background text-on-surface font-body-lg min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Subtle Background Decoration -->
<div class="absolute top-[-10%] right-[-10%] w-[40rem] h-[40rem] bg-primary-fixed/30 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-secondary-fixed/20 rounded-full blur-[80px] pointer-events-none"></div>
<main class="w-full max-w-md px-margin-mobile md:px-0 z-10">
<div class="bg-white p-lg md:p-xl rounded-xl soft-shadow border border-surface-container flex flex-col items-center">
<!-- Branding -->
<div class="mb-lg text-center">
<div class="flex items-center justify-center mb-base">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center text-white shadow-lg shadow-primary/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save_as</span>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">CloudCrackers</h1>
<p class="text-on-surface-variant font-body-md mt-xs">Ignite your experience with premium pyrotechnics.</p>
</div>
<!-- Login Form -->
<form action="#" class="w-full space-y-md" onsubmit="event.preventDefault()">
<div class="space-y-base">
<label class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider block ml-xs" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">mail</span>
</div>
<input class="w-full bg-surface-container-low border border-surface-container rounded-lg py-3 pl-10 pr-4 text-on-surface focus:ring-2 focus:ring-secondary-container focus:border-transparent transition-all outline-none" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<div class="space-y-base">
<div class="flex justify-between items-center px-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-body-md text-tertiary hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="w-full bg-surface-container-low border border-surface-container rounded-lg py-3 pl-10 pr-12 text-on-surface focus:ring-2 focus:ring-secondary-container focus:border-transparent transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-center space-x-2 px-xs">
<input class="w-4 h-4 text-primary bg-surface-container border-surface-variant rounded focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-md text-on-surface-variant" for="remember">Keep me signed in</label>
</div>
<button class="w-full bg-primary text-white font-title-lg text-body-lg py-4 rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all shadow-lg shadow-primary/25" type="submit">
                    Login to Account
                </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-lg">
<div class="flex-grow h-px bg-surface-container"></div>
<span class="px-md font-label-lg text-label-lg text-on-surface-variant uppercase">Or continue with</span>
<div class="flex-grow h-px bg-surface-container"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md w-full">
<button class="flex items-center justify-center space-x-2 border border-surface-container rounded-lg py-3 hover:bg-surface-container-low transition-colors active:scale-95">
<div class="w-5 h-5 flex items-center justify-center">
<svg class="w-full h-full" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 6.13l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
</div>
<span class="font-body-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center space-x-2 border border-surface-container rounded-lg py-3 hover:bg-surface-container-low transition-colors active:scale-95">
<div class="w-5 h-5 flex items-center justify-center text-on-surface">
<svg class="w-full h-full fill-current" viewbox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.06.77.77-.03 1.99-.86 3.4-.76 1.73.12 3.03.8 3.86 2.04-3.52 2.11-2.96 6.84.47 8.32-.69 1.58-1.78 3.14-2.79 4.6zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.51-3.74 4.25z"></path></svg>
</div>
<span class="font-body-md text-on-surface">Apple</span>
</button>
</div>
<!-- Signup link -->
<p class="mt-lg font-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline ml-xs transition-all" href="#">Sign Up</a>
</p>
</div>
<!-- Footer / Legal -->
<div class="mt-md text-center opacity-50">
<p class="text-[10px] uppercase tracking-widest text-on-surface-variant">
                © 2024 CloudCrackers Pyrotechnics. All rights reserved. 
            </p>
<div class="flex justify-center space-x-md mt-xs font-label-lg text-label-lg">
<a class="hover:text-primary" href="#">Privacy Policy</a>
<a class="hover:text-primary" href="#">Terms of Service</a>
</div>
</div>
</main>
<!-- Background Atmospheric Effect -->
<script>
        // Optional subtle floating interaction
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
            document.querySelector('main').style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // Toggle Password Visibility
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        const icon = toggleBtn.querySelector('span');

        toggleBtn.addEventListener('click', () => {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    </script>
</body></html>
