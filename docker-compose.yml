version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cloudcrackers-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cloudcrackers
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudcrackers-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - MONGODB_URL=mongodb://mongodb:27017
      - DB_NAME=cloudcrackers
      - JWT_SECRET_KEY=local_docker_jwt_super_secret_key_change_in_production
    depends_on:
      - mongodb

volumes:
  mongodb_data:

